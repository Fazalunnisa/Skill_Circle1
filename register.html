<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Skill Circle</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c9d6ff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: #8f94fb;
            border-radius: 50%;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: #4e54c8;
            border-radius: 50%;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(40px);
            }
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 35px 50px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .form-control {
            border-radius: 12px;
            padding: 10px 18px;
            border: 1px solid #e1e5eb;
            background: #f8fafc;
            transition: all 0.3s;
        }

        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(78, 84, 200, 0.1);
            border-color: #4e54c8;
            background: #fff;
        }

        .btn-primary {
            background: linear-gradient(90deg, #4e54c8, #8f94fb);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(78, 84, 200, 0.4);
        }

        .btn-google {
            background: white;
            border: 1px solid #e1e5eb;
            color: #333;
            padding: 10px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-google:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e1e5eb;
        }

        .divider span {
            padding: 0 16px;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Toast Styles */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .custom-toast {
            background: white;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-width: 280px;
        }

        .custom-toast.show {
            transform: translateX(0);
        }

        .toast-success {
            border-left: 5px solid #22c55e;
            color: #166534;
        }

        .toast-error {
            border-left: 5px solid #ef4444;
            color: #991b1b;
        }

        .toast-info {
            border-left: 5px solid #3b82f6;
            color: #1e3a8a;
        }
    </style>
    <script src="config.js"></script>
</head>

<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div id="toastContainer" class="toast-container"></div>

    <div class="auth-card mx-3">
        <button class="btn btn-sm btn-light position-absolute"
            style="top: 20px; left: 20px; border-radius: 50%; width: 35px; height: 35px;"
            onclick="location.href='welcome.html'"><i class="fa-solid fa-arrow-left"></i></button>

        <div class="text-center mb-4 mt-2">
            <h2 class="fw-bold mb-1" style="color: #1e293b; font-size: 26px;">Create Account</h2>
            <p style="color: #64748b; font-size: 14px;">Join SkillCircle and start your journey.</p>
        </div>

        <button id="googleBtn" class="btn w-100 btn-google mb-3 d-flex align-items-center justify-content-center gap-3"
            onclick="fakeGoogleAuth()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" style="height: 18px;"
                alt="G"> Sign up with Google
        </button>

        <div class="divider">
            <span>OR SIGN UP WITH EMAIL</span>
        </div>

        <div class="mb-3">
            <label class="form-label text-muted fw-bold mb-1" style="font-size: 12px;">FULL NAME</label>
            <input type="text" id="name" class="form-control" placeholder="John Doe">
        </div>

        <div class="mb-3">
            <label class="form-label text-muted fw-bold mb-1" style="font-size: 12px;">EMAIL ADDRESS</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com">
        </div>

        <div class="mb-4">
            <label class="form-label text-muted fw-bold mb-1" style="font-size: 12px;">PASSWORD</label>
            <div class="position-relative">
                <input type="password" id="password" class="form-control" placeholder="••••••••">
                <i class="fa-regular fa-eye position-absolute"
                    style="right: 16px; top: 12px; color: #94a3b8; cursor: pointer;"
                    onclick="togglePwd('password')"></i>
            </div>
        </div>

        <button class="btn btn-primary w-100 mb-4" onclick="signup()">Create Account</button>

        <p class="text-center mb-0" style="color: #64748b; font-size: 14px;">
            Already have an account? <a href="login.html" class="text-decoration-none fw-bold"
                style="color: #4e54c8;">Log in</a>
        </p>
    </div>

    <!-- Native Logic Layer -->
    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const icon = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info');

            const toast = document.createElement('div');
            toast.className = `custom-toast toast-${type}`;
            toast.innerHTML = `
                <i class="fa-solid ${icon}"></i>
                <span class="fw-medium">${message}</span>
            `;

            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        async function signup() {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!name || !email || !password) {
                showToast("Missing Data: Please complete all form fields.", "error");
                return;
            }
            if (!/^[a-zA-Z\s]+$/.test(name) || name.length < 3) {
                showToast("Name Policy: Use only letters (min 3 chars).", "error");
                return;
            }
            if (!/^[^\s@]*[a-zA-Z][^\s@]*@[^\s@]+\.[a-zA-Z]{2,}$/.test(email)) {
                showToast("Email Invalid: Check format carefully.", "error");
                return;
            }
            if (password.length < 6) {
                showToast("Security: Password must be at least 6 characters.", "error");
                return;
            }

            try {
                const response = await fetch(API_BASE_URL + "/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ fullname: name, email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showToast("Account Locked In! Redirecting to login...", "success");
                    setTimeout(() => window.location.href = "login.html", 2000);
                } else {
                    showToast("System Check: " + data.detail, "error");
                }
            } catch (error) {
                showToast("Backend link lost. Running in high-safety demo mode.", "info");
            }
        }
    </script>
    <script>
        function togglePwd(id) {
            const pwd = document.getElementById(id);
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
        }

        function fakeGoogleAuth() {
            // Simulate the Google account selection screen
            const email = prompt("Google Sign-In Simulator:\nPlease select or enter your Google email address to continue:");

            if (email && email.includes("@") && email.includes(".")) {
                const btn = document.getElementById('googleBtn');
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying Account...';

                setTimeout(() => {
                    const username = email.split("@")[0].toUpperCase();
                    // Save user to local storage and login seamlessly
                    localStorage.setItem("user", JSON.stringify({ email: email, fullname: username }));
                    window.location.href = "dashboard.html";

                    // Reset button for browser back-navigation caching
                    setTimeout(() => {
                        btn.innerHTML = '<img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" style="height: 18px;" alt="G"> Sign up with Google';
                    }, 500);
                }, 1500);
            } else if (email) {
                alert("Authentication Failed: Please enter a valid email address.");
            }
        }
    </script>
</body>

</html>
