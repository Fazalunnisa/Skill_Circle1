<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Skill Circle</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #c9d6ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      position: relative;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.6;
      animation: float 10s infinite ease-in-out alternate;
    }

    .blob-1 {
      top: -10%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: #8f94fb;
      border-radius: 50%;
    }

    .blob-2 {
      bottom: -10%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: #4e54c8;
      border-radius: 50%;
    }

    @keyframes float {
      0% {
        transform: translateY(0);
      }

      100% {
        transform: translateY(40px);
      }
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px 50px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
      position: relative;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .form-control {
      border-radius: 12px;
      padding: 12px 18px;
      border: 1px solid #e1e5eb;
      background: #f8fafc;
      transition: all 0.3s;
    }

    .form-control:focus {
      box-shadow: 0 0 0 4px rgba(78, 84, 200, 0.1);
      border-color: #4e54c8;
      background: #fff;
    }

    .btn-primary {
      background: linear-gradient(90deg, #4e54c8, #8f94fb);
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(78, 84, 200, 0.4);
    }

    .btn-google {
      background: white;
      border: 1px solid #e1e5eb;
      color: #333;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-google:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e1e5eb;
    }

    .divider span {
      padding: 0 16px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* Toast Styles */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
    }

    .custom-toast {
      background: white;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateX(120%);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .custom-toast.show {
      transform: translateX(0);
    }

    .toast-success {
      border-left: 5px solid #22c55e;
      color: #166534;
    }

    .toast-error {
      border-left: 5px solid #ef4444;
      color: #991b1b;
    }
  </style>
</head>

<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div id="toastContainer" class="toast-container"></div>

  <div class="auth-card mx-3">
    <button class="btn btn-sm btn-light position-absolute"
      style="top: 20px; left: 20px; border-radius: 50%; width: 35px; height: 35px;"
      onclick="location.href='welcome.html'"><i class="fa-solid fa-arrow-left"></i></button>

    <div class="text-center mb-4 mt-2">
      <div class="mx-auto mb-3"
        style="height: 65px; width: 65px; background: white; border-radius: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border: 1px solid #eee;">
        <i class="fa-solid fa-graduation-cap" style="color: #4e54c8; font-size: 32px;"></i>
      </div>
      <h2 class="fw-bold mb-1" style="color: #1e293b; font-size: 26px;">Welcome Back</h2>
      <p style="color: #64748b; font-size: 15px;">Log in to continue your learning journey.</p>
    </div>

    <button id="googleBtn" class="btn w-100 btn-google mb-3 d-flex align-items-center justify-content-center gap-3"
      onclick="fakeGoogleAuth()">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" style="height: 20px;"
        alt="G"> Continue with Google
    </button>

    <div class="divider">
      <span>OR LOGIN WITH EMAIL</span>
    </div>

    <div class="mb-3">
      <label class="form-label text-muted fw-bold mb-1" style="font-size: 12px;">EMAIL ADDRESS</label>
      <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com">
    </div>

    <div class="mb-4">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <label class="form-label text-muted fw-bold mb-0" style="font-size: 12px;">PASSWORD</label>
        <a href="javascript:void(0)" class="text-decoration-none"
          style="font-size: 13px; color: #4e54c8; font-weight: 500;" onclick="openForgotModal()">Forgot
          password?</a>
      </div>
      <div class="position-relative mt-1">
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
        <i class="fa-regular fa-eye position-absolute" style="right: 16px; top: 14px; color: #94a3b8; cursor: pointer;"
          onclick="togglePwd('loginPassword')"></i>
      </div>
    </div>

    <button class="btn btn-primary w-100 mb-4" onclick="login()">Log In</button>

    <p class="text-center mb-0" style="color: #64748b; font-size: 14px;">
      Don't have an account? <a href="register.html" class="text-decoration-none fw-bold" style="color: #4e54c8;">Sign
        up now</a>
    </p>
  </div>

  <!-- Natively Implemented Authentication Layer -->
  <script>
    /* TOAST SYSTEM */
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const icon = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info');

      const toast = document.createElement('div');
      toast.className = `custom-toast toast-${type}`;
      toast.innerHTML = `
          <i class="fa-solid ${icon}"></i>
          <span class="fw-medium">${message}</span>
      `;

      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 100);

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 500);
      }, 3000);
    }

    async function login() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (!email || !password) {
        showToast("Access Denied: Please fill out all required credentials.", "error");
        return;
      }

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();

        if (response.ok) {
          showToast(`Handshake Verified! Welcome, ${data.user.fullname}.`, "success");
          localStorage.setItem("user", JSON.stringify(data.user));
          setTimeout(() => window.location.href = "index.html", 1500);
        } else {
          showToast(`Security Check: ${data.detail}`, "error");
        }
      } catch (error) {
        showToast("Server Status Error: Could not verify credentials.", "error");
      }
    }
  </script>
  <script>
    function togglePwd(id) {
      const pwd = document.getElementById(id);
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    function fakeGoogleAuth() {
      // Simulate the Google account selection screen
      const email = prompt("Google Sign-In Simulator:\nPlease select or enter your Google email address to continue:");

      if (email && email.includes("@") && email.includes(".")) {
        const btn = document.getElementById('googleBtn');
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying Account...';

        setTimeout(() => {
          const username = email.split("@")[0].toUpperCase();
          // Save user to local storage and login seamlessly
          localStorage.setItem("user", JSON.stringify({ email: email, fullname: username }));
          window.location.href = "index.html";

          // Reset button for browser back-navigation caching
          setTimeout(() => {
            btn.innerHTML = '<img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" style="height: 20px;" alt="G"> Continue with Google';
          }, 500);
        }, 1500);
      } else if (email) {
        alert("Authentication Failed: Please enter a valid email address.");
      }
    }

    /* FORGOT PASSWORD LOGIC */
    let resetEmail = "";

    function openForgotModal() {
      const modalHtml = `
        <div id="forgotModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;">
          <div id="forgotCard" style="background:white; padding:40px; border-radius:24px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.2); position:relative; text-align:center;">
             <button onclick="closeForgotModal()" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:20px; color:#94a3b8;">&times;</button>
             
             <div id="forgotInitial">
                <i class="fa-solid fa-key mb-3" style="font-size:40px; color:#4e54c8;"></i>
                <h4 class="fw-bold mb-2">Password Recovery</h4>
                <p class="text-muted small mb-4">Enter your registered email to search for your account.</p>
                <input type="email" id="forgotEmail" class="form-control mb-3" placeholder="Enter your email" style="border-radius:12px;">
                <button onclick="verifyEmail()" class="btn btn-primary w-100 rounded-pill">Verify Email</button>
             </div>

             <div id="resetFlow" style="display:none;">
                <i class="fa-solid fa-shield-halved mb-3" style="font-size:40px; color:#fbbf24;"></i>
                <h4 class="fw-bold mb-2">Create New Password</h4>
                <p class="text-muted small mb-4">Account verified! You can now set your new access credentials.</p>
                <input type="password" id="newPassword" class="form-control mb-3" placeholder="Enter new password" style="border-radius:12px;">
                <button onclick="executeReset()" class="btn btn-warning w-100 rounded-pill fw-bold text-white">Update Password</button>
             </div>

             <div id="forgotSuccess" style="display:none;">
                <i class="fa-solid fa-circle-check mb-3" style="font-size:50px; color:#22c55e;"></i>
                <h4 class="fw-bold mb-2">Password Reset!</h4>
                <p class="text-muted small mb-4">Your security credentials have been successfully updated. You can now login with your new password.</p>
                <button onclick="closeForgotModal()" class="btn btn-outline-primary w-100 rounded-pill">Proceed to Login</button>
             </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function closeForgotModal() {
      const modal = document.getElementById("forgotModal");
      if (modal) modal.remove();
    }

    function verifyEmail() {
      resetEmail = document.getElementById("forgotEmail").value.trim();
      if (!resetEmail || !resetEmail.includes("@")) {
        alert("Please enter a valid email address.");
        return;
      }

      const btn = document.querySelector("#forgotInitial button");
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Locating Account...';
      btn.disabled = true;

      // Simulate verification check
      setTimeout(() => {
        document.getElementById("forgotInitial").style.display = "none";
        document.getElementById("resetFlow").style.display = "block";
      }, 1500);
    }

    async function executeReset() {
      const newPwd = document.getElementById("newPassword").value;
      if (newPwd.length < 6) {
        alert("Security Requirement: Password must be at least 6 characters long.");
        return;
      }

      const btn = document.querySelector("#resetFlow button");
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Updating Database...';
      btn.disabled = true;

      try {
        const response = await fetch("/api/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: resetEmail, new_password: newPwd })
        });

        if (response.ok) {
          document.getElementById("resetFlow").style.display = "none";
          document.getElementById("forgotSuccess").style.display = "block";
        } else {
          const data = await response.json();
          alert("Error: " + data.detail);
          btn.innerHTML = 'Update Password';
          btn.disabled = false;
        }
      } catch (e) {
        alert("System Error: Could not reach the backend to perform security update.");
      }
    }
  </script>
</body>

</html>
