<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillCircle - Welcome</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style2.css">

    <style>
        body {
            background-color: #f5f7fa;
            overflow: hidden;
            /* STRICTLY NO SCROLLING */
            font-family: 'Poppins', sans-serif;
            position: relative;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.35;
            animation: float 12s infinite ease-in-out alternate;
        }

        .blob-1 {
            top: -20%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: #8f94fb;
            border-radius: 50%;
        }

        .blob-2 {
            bottom: -20%;
            right: -10%;
            width: 700px;
            height: 700px;
            background: #4e54c8;
            border-radius: 50%;
            animation-delay: -6s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(80px, 80px) scale(1.1);
            }
        }

        .btn-start {
            background: linear-gradient(90deg, #4e54c8, #8f94fb);
            border: none;
            font-size: 18px;
            padding: 14px 40px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(78, 84, 200, 0.4);
        }

        .btn-start:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(78, 84, 200, 0.6);
            color: white;
            background: linear-gradient(90deg, #3f44a3, #787ce6);
        }

        .hero-img-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .hero-img {
            border: 6px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
            max-width: 95%;
            max-height: 75vh;
            object-fit: cover;
            transition: transform 0.8s ease;
        }

        .hero-img:hover {
            transform: scale(1.03) translateY(-5px);
        }

        .nav-hover {
            position: relative;
            transition: 0.3s;
        }

        .nav-hover::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #fff;
            transition: width 0.3s ease;
        }

        .nav-hover:hover::after {
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Top Navigation matched to style2.css -->
    <nav class="navbar navbar-expand-lg navbar-custom px-4"
        style="height: 80px; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <a class="navbar-brand d-flex align-items-center" href="welcome.html">
            <div
                style="background: white; width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">
                <i class="fa-solid fa-graduation-cap" style="color: #4e54c8; font-size: 22px;"></i>
            </div>
            <span class="brand-text" style="font-size: 30px;">Skill</span> <span class="ms-2 brand-text"
                style="font-size: 30px;">Circle</span>
        </a>

        <div class="ms-auto d-flex align-items-center gap-4">
            <a href="contact.html" class="fw-medium text-white text-decoration-none nav-hover"
                style="font-size: 16px;"><i class="fa-regular fa-envelope me-1"></i> Contact Us</a>
        </div>
    </nav>

    <!-- Hero Content (Fixed bounds, No scrolling) -->
    <main class="container-fluid px-5" style="height: calc(100vh - 80px);">
        <div class="row h-100 align-items-center">

            <!-- Left Text Section -->
            <div class="col-lg-6 text-center">
                <span class="badge px-4 py-2 rounded-pill mb-4"
                    style="font-size: 13px; font-weight: 600; background: rgba(78, 84, 200, 0.1); color: #4e54c8; border: 1px solid rgba(78, 84, 200, 0.2);">
                    <i class="fa-solid fa-rocket me-2"></i> Elevate Your Learning Journey
                </span>

                <h1 class="fw-bold mb-3 mx-auto"
                    style="color: #2b2b2b; font-family: 'Playfair Display', serif; line-height: 1.1; font-size: 65px; max-width: 600px;">
                    Seamless Peer<br>Learning <br>
                    <span
                        style="background: linear-gradient(45deg, #4e54c8, #8f94fb); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 50px;">For
                        A Brighter Future</span>
                </h1>

                <p class="lead mb-5 mx-auto"
                    style="color: #5a5a5a; font-size: 17px; line-height: 1.6; max-width: 480px;">
                    SkillCircle is an incredibly powerful peer-learning platform where you can master new skills, grow
                    together, and unlock your true potential effortlessly.
                </p>

                <button onclick="location.href='login.html'"
                    class="btn btn-start rounded-pill text-white fw-bold mx-auto">
                    Start Learning Now <i class="fa-solid fa-arrow-right ms-2"></i>
                </button>
            </div>

            <!-- Right Image Section -->
            <div class="col-lg-6 h-100 d-none d-lg-block pb-4 pe-lg-5">
                <div class="hero-img-container">
                    <img src="Hero.png" alt="Students Learning Together" class="hero-img">
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
